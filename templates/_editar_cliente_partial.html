<form action="/editar-cliente/{{ customer.id }}" method="POST" class="p-6 space-y-6 max-h-[calc(100vh-16rem)] overflow-y-auto">
    {% set modal_suffix = 'edit' %}
    {% include "_cliente_form_fields.html" with context %}
    <div class="flex items-center justify-end gap-4 pt-4 border-t border-slate-100 dark:border-slate-800">
        <button type="button" id="btn-cancel-editar-cliente"
            class="text-xs font-black text-slate-400 hover:text-slate-900 dark:hover:text-white uppercase tracking-widest transition-colors">Cancelar</button>
        <button type="submit"
            class="bg-primary hover:bg-primary/90 text-white px-8 py-3 rounded-xl font-black text-xs uppercase tracking-[0.2em] shadow-lg shadow-primary/30 hover:scale-[1.02] transition-all">
            Guardar Cambios
        </button>
    </div>
</form>

<script nonce="{{ request.state.script_nonce }}">
    initializeEditModalScripts();
</script>
