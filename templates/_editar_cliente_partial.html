<form action="/editar-cliente/{{ customer.id }}" method="POST" class="p-6 space-y-6 max-h-[calc(100vh-16rem)] overflow-y-auto">
    {% if not customer.is_active %}
    <div class="flex items-center gap-3 p-4 bg-red-50 border border-red-200 rounded-xl">
        <span class="material-symbols-rounded text-red-500" aria-hidden="true">block</span>
        <div>
            <p class="text-sm font-bold text-red-700">Cliente Inactivo — Solo lectura</p>
            <p class="text-xs text-red-500 mt-0.5">Motivo: {{ customer.inactivation_reason or 'No especificado' }}</p>
        </div>
    </div>
    {% endif %}
    {% set modal_suffix = 'edit' %}
    {% include "_cliente_form_fields.html" with context %}
    <div class="flex items-center justify-end gap-4 pt-4 border-t border-slate-100">
        <button type="button" id="btn-cancel-editar-cliente"
            class="text-xs font-black text-slate-400 hover:text-slate-900 uppercase tracking-widest transition-colors">Cancelar</button>
        {% if customer.is_active %}
        <button type="submit"
            class="bg-primary hover:bg-primary/90 text-white px-8 py-3 rounded-xl font-black text-xs uppercase tracking-[0.2em] shadow-lg shadow-primary/30 hover:scale-[1.02] transition-all">
            Guardar Cambios
        </button>
        {% endif %}
    </div>
</form>

<script nonce="{{ request.state.script_nonce }}">
    initializeEditModalScripts();
</script>
