<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Crear Usuario | CRM-AT</title>
    <link href="{{ url_for('static', path='/css/tailwind.css') }}" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; line-height: 1; }
    </style>
</head>
<body class="h-full bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-3 pointer-events-none"></div>

    <div class="min-h-full flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <div class="size-16 rounded-2xl bg-primary flex items-center justify-center text-white shadow-xl shadow-primary/20 mx-auto mb-4">
                    <span class="material-symbols-rounded text-3xl">person_add</span>
                </div>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">CRM-AT</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mt-1">Crear nuevo usuario</p>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-8">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-rounded text-amber-500 text-lg">admin_panel_settings</span>
                    <h2 class="text-lg font-black text-slate-900 dark:text-white">Administración de Usuarios</h2>
                </div>

                {% if error %}
                <div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm font-semibold mb-6">
                    <span class="material-symbols-rounded text-lg">error</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                {% if success %}
                <div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-sm font-semibold mb-6">
                    <span class="material-symbols-rounded text-lg">check_circle</span>
                    <span>{{ success }}</span>
                </div>
                {% endif %}

                <form method="POST" action="/auth/register" class="space-y-4" id="registerForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nombre Completo</label>
                        <input name="full_name" required
                            class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-4 focus:ring-primary/10 transition-all"
                            placeholder="Juan Pérez" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Usuario</label>
                        <input name="username" required
                            class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-4 focus:ring-primary/10 transition-all"
                            placeholder="jperez" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Correo Electrónico</label>
                        <input name="email" type="email" required
                            class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-4 focus:ring-primary/10 transition-all"
                            placeholder="juan@ejemplo.com" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Contraseña</label>
                        <input name="password" type="password" required minlength="6"
                            class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-4 focus:ring-primary/10 transition-all"
                            placeholder="Mínimo 6 caracteres" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Rol</label>
                        <select name="role"
                            class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-4 focus:ring-primary/10 transition-all">
                            <option value="user">Usuario</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <button type="submit"
                        class="w-full bg-primary hover:bg-primary/90 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-primary/30 hover:scale-[1.01] transition-all mt-2">
                        Crear Usuario
                    </button>
                </form>

                <div class="text-center mt-6">
                    <a href="/auth/usuarios" class="text-xs text-primary font-bold hover:underline flex items-center justify-center gap-1">
                        <span class="material-symbols-rounded text-sm">list_alt</span>
                        Ver todos los usuarios
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script nonce="{{ request.state.script_nonce }}" src="{{ url_for('static', path='/js/app.js') }}"></script>
    <script nonce="{{ request.state.script_nonce }}">
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            if (form) setupFormValidation(form);
        });
    </script>
</body>
</html>
