<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Iniciar Sesión | CRM-AT</title>
    <link href="{{ static_url('css/tailwind.css') }}" rel="stylesheet" />
    <link href="{{ static_url('css/fonts.css') }}" rel="stylesheet" />
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet" />
</head>
<body class="h-full bg-background-light font-display text-texto-fuerte">
    <div id="toastContainer" role="status" aria-live="polite" aria-atomic="true" aria-relevant="additions" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-3 pointer-events-none"></div>

    <div class="min-h-full flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <div class="size-16 rounded-2xl bg-primary flex items-center justify-center text-white shadow-xl shadow-primary/20 mx-auto mb-4">
                    <span class="material-symbols-rounded text-3xl" aria-hidden="true">package_2</span>
                </div>
                <h1 class="text-2xl font-black text-texto-fuerte tracking-tight">CRM-AT</h1>
                <p class="text-sm text-texto-suave font-medium mt-1">Gestión Operativa</p>
            </div>

            <div class="bg-white rounded-3xl border border-superficie-borde shadow-2xl p-8">
                <h2 class="text-lg font-black text-texto-fuerte mb-6">Iniciar Sesión</h2>

                {% if error %}
                <div role="alert" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-peligro-50 border border-peligro-200 text-peligro-700 text-sm font-semibold mb-6">
                    <span class="material-symbols-rounded text-lg" aria-hidden="true">error</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" action="/auth/login" class="space-y-5" id="loginForm">
                    <div class="space-y-2">
                        <label for="login-username" class="text-2xs font-black text-texto-tenue tracking-normal">Usuario o Correo</label>
                        <div class="relative">
                            <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-texto-tenue" aria-hidden="true">person</span>
                            <input id="login-username" name="username" required
                                class="w-full bg-superficie-suave border-none rounded-xl pl-10 pr-4 py-3 text-sm font-bold text-texto-fuerte placeholder:text-texto-tenue focus:ring-4 focus:ring-primary/10 transition-all"
                                placeholder="usuario@ejemplo.com" />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label for="login-password" class="text-2xs font-black text-texto-tenue tracking-normal">Contraseña</label>
                        <div class="relative">
                            <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-texto-tenue" aria-hidden="true">lock</span>
                            <input id="login-password" name="password" type="password" required
                                class="w-full bg-superficie-suave border-none rounded-xl pl-10 pr-4 py-3 text-sm font-bold text-texto-fuerte placeholder:text-texto-tenue focus:ring-4 focus:ring-primary/10 transition-all"
                                placeholder="••••••••" />
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full bg-primary hover:bg-primary/90 text-white py-3.5 rounded-xl font-black text-xs tracking-normal shadow-lg shadow-primary/30 hover:scale-[1.01] transition-all">
                        Ingresar
                    </button>
                </form>

                <p class="text-center text-xs text-texto-tenue font-medium mt-6">
                    ¿No tienes cuenta?
                    <a href="/auth/register" class="text-primary font-bold hover:underline">Crear cuenta</a>
                </p>
            </div>
        </div>
    </div>

    <script nonce="{{ request.state.script_nonce }}" src="{{ static_url('js/app.js') }}"></script>
    <script nonce="{{ request.state.script_nonce }}">
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            if (form) setupFormValidation(form);
        });
    </script>
</body>
</html>
