{% extends "layout.html" %}

{% block title %}Organigrama | CRM-AT{% endblock %}

{% block header_extra %}
<div class="flex flex-col">
    <h2 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-tighter">Organigrama</h2>
    <p class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">Estructura del Equipo</p>
</div>
{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-4 animate-fade-in pb-10">

    <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-3 rounded-xl shadow-sm">
        <div class="flex items-center gap-3">
            <span class="material-symbols-rounded text-primary text-lg" aria-hidden="true">groups</span>
            <select id="customerSelect"
                class="flex-1 bg-slate-50 dark:bg-slate-800 border-none rounded-xl px-4 py-3 text-sm font-bold focus:ring-4 focus:ring-primary/10 transition-all uppercase">
                <option value="">SELECCIONAR CLIENTE...</option>
                {% for c in customers %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
    </section>

    <div id="orgContainer" class="hidden space-y-4">
        <div class="text-center py-12 text-slate-400">
            <span class="material-symbols-rounded text-4xl" aria-hidden="true">account_tree</span>
            <p class="text-xs font-bold mt-2">Selecciona un cliente para ver su organigrama</p>
        </div>
    </div>

    <div id="orgContent" class="space-y-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ request.state.script_nonce }}">
document.getElementById('customerSelect')?.addEventListener('change', function() {
    const customerId = this.value;
    const container = document.getElementById('orgContent');
    if (!customerId) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = '<div class="text-center py-12 text-slate-400"><span class="material-symbols-rounded text-4xl animate-spin" aria-hidden="true">hourglass_top</span><p class="text-xs font-bold mt-2">Cargando...</p></div>';
    fetch(`/api/cliente-team/${customerId}`)
        .then(r => r.json())
        .then(team => {
            if (!team || team.length === 0) {
                container.innerHTML = '<div class="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm"><span class="material-symbols-rounded text-4xl text-slate-300" aria-hidden="true">groups_off</span><p class="text-xs font-bold text-slate-400 mt-2">Este cliente no tiene equipo registrado</p></div>';
                return;
            }
            renderOrgChart(team);
        })
        .catch(() => {
            container.innerHTML = '<div class="text-center py-12 text-red-400"><span class="material-symbols-rounded text-4xl" aria-hidden="true">error</span><p class="text-xs font-bold mt-2">Error al cargar datos</p></div>';
        });
});

function renderOrgChart(team) {
    const sectors = {};
    team.forEach(m => {
        const s = m.sector || 'SIN SECTOR';
        if (!sectors[s]) sectors[s] = [];
        sectors[s].push(m);
    });

    const sortedSectors = Object.keys(sectors).sort();
    let html = '';

    sortedSectors.forEach(sector => {
        const members = sectors[sector];
        const tree = buildTree(members);
        html += `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="px-5 py-3 bg-slate-50/50 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2">
                <span class="material-symbols-rounded text-primary text-lg" aria-hidden="true">folder</span>
                <h3 class="text-xs font-black text-slate-900 dark:text-white uppercase tracking-wider">${sector}</h3>
                <span class="ml-auto text-[10px] font-bold text-slate-400">${members.length} miembro${members.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="p-5">
                ${renderTree(tree)}
            </div>
        </div>`;
    });

    document.getElementById('orgContent').innerHTML = html;
}

function buildTree(members) {
    const map = {};
    const roots = [];

    members.forEach(m => {
        map[m.name] = { ...m, children: [] };
    });

    members.forEach(m => {
        if (m.reports_to && map[m.reports_to]) {
            map[m.reports_to].children.push(map[m.name]);
        } else {
            roots.push(map[m.name]);
        }
    });

    return roots;
}

function renderTree(nodes, level = 0) {
    if (!nodes || nodes.length === 0) return '';
    let html = '';
    const paddingLeft = level * 24;

    nodes.forEach((node, idx) => {
        const hasChildren = node.children && node.children.length > 0;
        const isLast = idx === nodes.length - 1;
        const connector = level === 0 ? '' : (isLast ? '└─' : '├─');
        html += `
        <div class="flex items-start gap-3 py-1.5 ${level > 0 ? 'border-l-2 border-slate-100 dark:border-slate-800' : ''}" style="padding-left: ${paddingLeft}px">
            <div class="size-9 rounded-xl bg-primary/5 border border-primary/10 flex items-center justify-center text-primary font-black text-xs shrink-0">
                ${getInitials(node.name)}
            </div>
            <div class="min-w-0 flex-1">
                <p class="text-sm font-bold text-slate-900 dark:text-white truncate">${node.name}</p>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${node.role || 'Sin cargo'}</p>
                ${node.phone ? `<p class="text-[9px] text-slate-400 mt-0.5 flex items-center gap-1"><span class="material-symbols-rounded text-[11px]" aria-hidden="true">call</span>${node.phone}</p>` : ''}
            </div>
        </div>`;
        if (hasChildren) {
            html += renderTree(node.children, level + 1);
        }
    });

    return html;
}

function getInitials(name) {
    if (!name) return '??';
    return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}
</script>
{% endblock %}
