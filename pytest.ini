[pytest]
# Por defecto se deseleccionan las pruebas que llaman a la API real: cuestan
# dinero y dependen de la red. Un `pytest` a secas corre todo lo demás, sin clave
# y sin red.
#
#     pytest                                    # todo menos la evaluación
#     pytest -m eval tests/test_agente_eval.py  # la evaluación, contra la API real
addopts = -m "not eval"

markers =
    eval: llama a la API real de DeepSeek (cuesta dinero; requiere DEEPSEEK_API_KEY)
