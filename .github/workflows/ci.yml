name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    # PostgreSQL es el único motor soportado, también en desarrollo: así lo que
    # se prueba es exactamente lo que corre en el servidor.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_at
          POSTGRES_PASSWORD: crm_at
          POSTGRES_DB: crm_at_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_at"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm_at:crm_at@localhost:5432/crm_at_test
      SECRET_KEY: ci-secret-key
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q main.py models.py database.py config.py logger.py templating.py routers services

      - name: Templates must compile
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          import glob, os, sys
          env = Environment(loader=FileSystemLoader("templates"))
          bad = []
          for path in sorted(glob.glob("templates/*.html")):
              name = os.path.basename(path)
              try:
                  env.get_template(name)
              except Exception as exc:
                  bad.append((name, exc))
          for name, exc in bad:
              print(f"::error file=templates/{name}::{exc}")
          sys.exit(1 if bad else 0)
          PY

      - name: Lint
        run: |
          pip install ruff
          ruff check --output-type=github . || true

      - name: Migrations must build a runnable schema
        run: |
          alembic upgrade head
          python main.py check-schema

      - name: Seed must create the initial administrator
        run: |
          python main.py seed
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              count = conn.execute(text("SELECT count(*) FROM users")).scalar()
          assert count >= 1, "el sembrado no creó ningún usuario"
          print(f"usuarios tras el sembrado: {count}")
          PY

      - name: Run tests
        run: python -m pytest -q --tb=short
