name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q main.py models.py database.py config.py logger.py templating.py routers services

      - name: Lint
        run: |
          pip install ruff
          ruff check --output-type=github . || true

      - name: Templates must compile
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          import glob, os, sys
          env = Environment(loader=FileSystemLoader("templates"))
          bad = []
          for path in sorted(glob.glob("templates/*.html")):
              name = os.path.basename(path)
              try:
                  env.get_template(name)
              except Exception as exc:
                  bad.append((name, exc))
          for name, exc in bad:
              print(f"::error file=templates/{name}::{exc}")
          sys.exit(1 if bad else 0)
          PY

      - name: Run tests
        run: python -m pytest -q --tb=short

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    # The project ships for PostgreSQL in production while developing on SQLite;
    # that divergence is exactly what hid the broken migrations and the
    # UNIQUE-index bug. These tests run the same suite against a real server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_at
          POSTGRES_PASSWORD: crm_at
          POSTGRES_DB: crm_at_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_at"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm_at:crm_at@localhost:5432/crm_at_test
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrations must build a runnable schema on PostgreSQL
        run: |
          alembic upgrade head
          python main.py check-schema
          python - <<'PY'
          # The schema produced by migrations must match the ORM models exactly.
          from sqlalchemy import create_engine, inspect
          import os, models
          from database import Base
          engine = create_engine(os.environ["DATABASE_URL"])
          insp = inspect(engine)
          migrated = set(insp.get_table_names()) - {"alembic_version"}
          modelled = set(Base.metadata.tables)
          missing = modelled - migrated
          extra = migrated - modelled
          assert not missing, f"tablas ausentes tras migrar: {sorted(missing)}"
          assert not extra, f"tablas sobrantes en la base: {sorted(extra)}"
          cols_missing = []
          for table in sorted(modelled):
              got = {c["name"] for c in insp.get_columns(table)}
              want = {c.name for c in Base.metadata.tables[table].columns}
              if want - got:
                  cols_missing.append((table, sorted(want - got)))
          assert not cols_missing, f"columnas ausentes tras migrar: {cols_missing}"
          print("Esquema PostgreSQL consistente con los modelos.")
          PY

      - name: Seed must create the initial administrator
        run: |
          python main.py seed
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              count = conn.execute(text("SELECT count(*) FROM users")).scalar()
          assert count >= 1, "el sembrado no creó ningún usuario"
          print(f"usuarios tras el sembrado: {count}")
          PY

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: crm-at:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
