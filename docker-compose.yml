version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=at_user
      - POSTGRES_PASSWORD=at_password
      - POSTGRES_DB=industrial_bi
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U at_user -d industrial_bi"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://at_user:at_password@db:5432/industrial_bi
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
    restart: always

volumes:
  postgres_data:
