# ─────────────────────────────────────────────────────────────────────────────
# CRM-AT — Nginx
#
# Copiar a /etc/nginx/sites-available/crm-at y enlazar:
#   ln -s /etc/nginx/sites-available/crm-at /etc/nginx/sites-enabled/crm-at
#   nginx -t && systemctl reload nginx
#
# IMPORTANTE: reemplazar el dominio por el real antes de usar. Este bloque
# escucha en HTTP; el certificado se añade después con:
#   certbot --nginx -d TU_DOMINIO
# Certbot agrega automáticamente el bloque :443 y la redirección desde :80.
# ─────────────────────────────────────────────────────────────────────────────

upstream crm_at_app {
    server 127.0.0.1:8020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ejemplo.com www.ejemplo.com;

    # Tamaño máximo de subida (informes con fotos).
    client_max_body_size 25m;

    # Logs separados de los de ejemplo.
    access_log /var/log/nginx/crm-at.access.log;
    error_log  /var/log/nginx/crm-at.error.log;

    # Los estáticos los sirve Nginx directamente: la app no necesita atenderlos.
    location /static/ {
        alias /var/www/crm_at/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Sonda de salud, sin autenticación.
    location = /health {
        proxy_pass http://crm_at_app;
        access_log off;
    }

    location / {
        proxy_pass http://crm_at_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;

        # La app ya envía sus propias cabeceras de seguridad; se mantienen las
        # de Nginx para respuestas servidas sin pasar por la aplicación.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
