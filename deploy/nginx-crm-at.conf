# ─────────────────────────────────────────────────────────────────────────────
# CRM-AT — Nginx (HTTP + HTTPS).
#
# Sirve la aplicación en el puerto 443 para `ejemplo.com`, `www.ejemplo.com`
# y la IP del servidor, y redirige el puerto 80 a HTTPS.
#
# El certificado es **provisional y autofirmado** (/etc/ssl/crm-at): cubre los
# tres nombres para que la aplicación sea usable de inmediato. Una vez que
# ejemplo.com resuelva a este servidor, se reemplaza por uno de Let's Encrypt
# con:  certbot --nginx -d ejemplo.com -d www.ejemplo.com
#
# No interfiere con otro-sitio.com: Nginx elige el vhost por `server_name` y
# ninguno de estos nombres está declarado en el vhost de ejemplo.
# ─────────────────────────────────────────────────────────────────────────────

upstream crm_at_app {
    server 127.0.0.1:8020;
    keepalive 16;
}

# ── Puerto 80: redirigir a HTTPS, salvo el desafío de Let's Encrypt ──────────
server {
    listen 80;
    listen [::]:80;
    server_name ejemplo.com www.ejemplo.com 203.0.113.10;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Puerto 443: la aplicación ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ejemplo.com www.ejemplo.com 203.0.113.10;

    ssl_certificate     /etc/ssl/crm-at/fullchain.pem;
    ssl_certificate_key /etc/ssl/crm-at/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/crm-at.access.log;
    error_log  /var/log/nginx/crm-at.error.log;

    client_max_body_size 25m;

    # Estáticos servidos por Nginx; los assets se cachean fuerte.
    location /static/ {
        alias /var/www/crm_at/static/;
        access_log off;
        try_files $uri =404;
        location ~* \.(?:woff2?|ttf|css|js|jpg|jpeg|png|webp|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /health {
        proxy_pass http://crm_at_app;
        access_log off;
    }

    location / {
        proxy_pass http://crm_at_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
