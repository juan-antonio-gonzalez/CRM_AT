# ─────────────────────────────────────────────────────────────────────────────
# CRM-AT — Nginx, HTTPS con el certificado ya presente en el servidor.
#
# Este vhost sirve la aplicación en https://servidor.ejemplo.com, que ya
# apunta a este VPS y cuyo certificado Let's Encrypt cubre ese nombre. Se usa
# como URL operativa mientras se corrige el DNS de ejemplo.com.
#
# No interfiere con otro-sitio.com: Nginx elige el vhost por `server_name`, y el
# de ejemplo no incluye este nombre.
#
# Cuando ejemplo.com resuelva al servidor, se agrega su nombre a `server_name`
# y se emite su certificado (ver DEPLOYMENT.md).
# ─────────────────────────────────────────────────────────────────────────────

upstream crm_at_app {
    server 127.0.0.1:8020;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name servidor.ejemplo.com;

    ssl_certificate     /etc/letsencrypt/live/servidor.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servidor.ejemplo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crm-at.access.log;
    error_log  /var/log/nginx/crm-at.error.log;

    client_max_body_size 25m;

    # Long-lived immutable assets, including the uploaded photos.
    location /static/ {
        alias /var/www/crm_at/static/;
        access_log off;
        try_files $uri =404;
        location ~* \.(?:woff2?|ttf|css|js|jpg|jpeg|png|webp|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /health {
        proxy_pass http://crm_at_app;
        access_log off;
    }

    location / {
        proxy_pass http://crm_at_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;

        # Fallback for anything the application does not serve itself.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
